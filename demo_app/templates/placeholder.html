<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ page_title }} | Harbor Credit Union</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            background: #f4f5f7;
            color: #20242a;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }


        .topbar {
            height: 64px;

            background: white;

            border-bottom: 1px solid #dedfe3;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }


        .brand {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .brand-mark {
            width: 34px;
            height: 34px;

            background: #1f3d5a;

            border-radius: 6px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            font-size: 14px;
            font-weight: 700;
        }


        .brand-name {
            font-size: 16px;
            font-weight: 650;
        }


        .internal-label {
            color: #777c84;

            font-size: 13px;
        }


        .layout {
            display: flex;

            min-height: calc(100vh - 64px);
        }


        .sidebar {
            width: 220px;

            background: white;

            border-right: 1px solid #dedfe3;

            padding: 28px 18px;
        }


        .nav-title {
            color: #91959c;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.8px;

            text-transform: uppercase;

            margin: 0 10px 12px;
        }


        .nav-item {
            display: block;

            padding: 10px 12px;

            margin-bottom: 4px;

            border-radius: 5px;

            color: #4b5058;

            font-size: 14px;

            text-decoration: none;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }


        .nav-item:hover {
            background: #f2f4f6;

            color: #173a56;
        }


        .nav-item.active {
            background: #edf2f6;

            color: #173a56;

            font-weight: 600;
        }


        main {
            flex: 1;

            padding: 46px;
        }


        .content {
            max-width: 760px;
        }


        .breadcrumb {
            margin-bottom: 14px;

            color: #7a7f87;

            font-size: 13px;
        }


        h1 {
            margin: 0;

            font-size: 29px;
            font-weight: 650;

            letter-spacing: -0.7px;
        }


        .card {
            margin-top: 30px;

            padding: 30px;

            background: white;

            border: 1px solid #dcdee2;
            border-radius: 8px;

            box-shadow:
                0 1px 2px rgba(20, 25, 30, 0.04);
        }


        .card h2 {
            margin: 0 0 10px;

            font-size: 16px;
            font-weight: 650;
        }


        .card p {
            margin: 0;

            color: #6f747c;

            font-size: 14px;

            line-height: 1.6;
        }


        .scope-label {
            display: inline-block;

            margin-top: 22px;

            padding: 6px 10px;

            background: #f1f3f5;

            border-radius: 4px;

            color: #6e737a;

            font-size: 12px;
            font-weight: 600;
        }


        .back-link {
            display: inline-block;

            margin-top: 26px;

            color: #315d7b;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;
        }


        .back-link:hover {
            text-decoration: underline;
        }


        @media (max-width: 760px) {

            .sidebar {
                display: none;
            }

            .topbar {
                padding: 0 20px;
            }

            main {
                padding: 30px 20px;
            }
        }

    </style>

</head>


<body>


    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                HC
            </div>

            <div class="brand-name">
                Harbor Credit Union
            </div>

        </div>


        <div class="internal-label">
            Operations Console
        </div>

    </header>


    <div class="layout">


        <aside class="sidebar">

            <div class="nav-title">
                Member Services
            </div>


            <a
                class="nav-item"
                href="/"
            >
                Member Search
            </a>


            <a
                class="nav-item {% if active_page == 'accounts' %}active{% endif %}"
                href="/accounts"
            >
                Accounts
            </a>


            <a
                class="nav-item {% if active_page == 'service_requests' %}active{% endif %}"
                href="/service-requests"
            >
                Service Requests
            </a>


            <a
                class="nav-item {% if active_page == 'activity' %}active{% endif %}"
                href="/activity"
            >
                Activity
            </a>

        </aside>


        <main>

            <div class="content">

                <div class="breadcrumb">
                    Member Services / {{ page_title }}
                </div>


                <h1>
                    {{ page_title }}
                </h1>


                <section class="card">

                    <h2>
                        {{ page_title }}
                    </h2>


                    <p>
                        {{ description }}
                    </p>


                    <div class="scope-label">
                        Outside current demo scope
                    </div>


                    <br>


                    <a
                        href="/"
                        class="back-link"
                    >
                        ← Return to Member Search
                    </a>

                </section>

            </div>

        </main>

    </div>

</body>

</html>
